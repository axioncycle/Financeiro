<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Axion — Pessoal</title>
<style>
:root{
  --bg:#080b16;--bg2:rgba(255,255,255,.045);--bg3:rgba(255,255,255,.07);--card:rgba(255,255,255,.055);--border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.16);
  --input:rgba(255,255,255,.06);--input-border:rgba(255,255,255,.14);--text:#eef2fb;--text2:#a3b1d1;--text3:#5f6d92;--accent:#8b93ff;--sbtn-bg:rgba(255,255,255,.06);
  --glass:blur(16px) saturate(150%);--shadow:0 10px 34px rgba(0,0,0,.42);--shadow-sm:0 3px 14px rgba(0,0,0,.30);
}
body.light{
  --bg:#eef1f8;--bg2:rgba(20,30,70,.04);--bg3:rgba(20,30,70,.07);--card:rgba(255,255,255,.72);--border:rgba(20,30,70,.10);--border2:rgba(20,30,70,.16);
  --input:rgba(255,255,255,.85);--input-border:rgba(20,30,70,.14);--text:#141a2e;--text2:#4a5578;--text3:#8b96b5;--accent:#6d5cf0;--sbtn-bg:rgba(20,30,70,.05);
  --glass:blur(16px) saturate(140%);--shadow:0 10px 30px rgba(60,70,120,.14);--shadow-sm:0 3px 12px rgba(60,70,120,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;padding-bottom:88px;-webkit-font-smoothing:antialiased;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 40% at 12% 18%, rgba(56,189,248,.16), transparent 60%),
  radial-gradient(55% 45% at 88% 42%, rgba(168,85,247,.18), transparent 60%),
  radial-gradient(70% 50% at 50% 108%, rgba(120,140,255,.14), transparent 60%);}
body.light::before{background:
  radial-gradient(60% 40% at 12% 15%, rgba(56,150,248,.16), transparent 60%),
  radial-gradient(55% 45% at 90% 40%, rgba(150,90,247,.14), transparent 60%),
  radial-gradient(70% 50% at 50% 108%, rgba(120,140,255,.12), transparent 60%);}
.num,.kpi .vl,.li .vl,.yr span{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm);}
.logo{font-size:15px;font-weight:900;color:var(--accent);letter-spacing:1.5px;line-height:1.05;}
.logo small{display:block;font-size:8px;color:var(--text3);letter-spacing:2px;margin-top:2px;}
.icbtn{background:var(--sbtn-bg);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;color:var(--text2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .15s;}
.icbtn:active{transform:scale(.9);background:var(--bg3);}
.nav{display:flex;background:var(--bg2);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:40;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
.nav::-webkit-scrollbar{display:none;}
.nb{position:relative;flex:1 0 auto;padding:10px 12px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.6px;transition:color .2s,border-color .2s;}
.nb .ic{display:inline-flex;transition:transform .2s;}
.nb.on{color:var(--accent);border-bottom-color:var(--accent);}
.nb.on .ic{transform:scale(1.12);}
.nb.on::after{content:'';position:absolute;bottom:-1px;left:15%;width:70%;height:2px;background:linear-gradient(90deg,var(--accent),#22c55e);border-radius:2px 2px 0 0;}
.page{display:none;padding:14px;max-width:960px;margin:0 auto;}
.page.on{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card{background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.hero{position:relative;overflow:hidden;border:1px solid rgba(139,147,255,.35);background:linear-gradient(135deg,rgba(139,147,255,.28),rgba(168,85,247,.16) 55%,rgba(56,189,248,.14));}
.hero::after{content:'';position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(139,147,255,.35),transparent 70%);pointer-events:none;}
.ttl{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;}
.kpi .lb{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.kpi .vl{font-size:18px;font-weight:800;margin-top:4px;letter-spacing:-.2px;}
.li{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px 10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:6px;border-left:3px solid var(--accent);}
.li .nm{font-size:13px;font-weight:700;line-height:1.25;}
.li .sb{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.3;}
.li .vl{font-size:15px;font-weight:800;text-align:right;white-space:nowrap;letter-spacing:-.2px;}
.del{background:none;border:none;-webkit-appearance:none;appearance:none;color:#ef4444;font-size:17px;cursor:pointer;width:34px;height:34px;line-height:1;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;}
.li .del{background:none;border:none;color:#ef4444;font-size:17px;cursor:pointer;width:36px;height:36px;line-height:1;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;transition:transform .08s,background .15s;}
.li .del:active{transform:scale(.88);background:var(--bg3);}
.fi{width:100%;background:var(--input);border:1px solid var(--input-border);border-radius:9px;padding:12px 12px;color:var(--text);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;}
select option,.fi option{background:var(--bg,#080b16);color:var(--text,#eef2fb);}
select optgroup,.fi optgroup{background:var(--bg,#080b16);color:var(--text,#eef2fb);}
input[type=date].fi{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.18);}
.fl{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
.btn-add{background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:11px;font-weight:800;font-size:14px;cursor:pointer;padding:13px;width:100%;min-height:48px;transition:transform .08s,opacity .15s;}
.btn-add:active{transform:scale(.98);opacity:.75;}
.empty{color:var(--text3);font-size:12px;text-align:center;padding:18px 12px;}
.bar{background:var(--bg3);border-radius:5px;height:8px;margin-top:6px;overflow:hidden;}
.bar>div{height:100%;border-radius:5px;background:var(--accent);transition:width .4s ease;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--accent);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#ef4444;}
.gr{color:#22c55e;}.rd{color:#ef4444;}.ac{color:var(--accent);}
.add-box{background:var(--bg2);border:1px dashed var(--border2);border-radius:13px;padding:13px;margin-top:10px;}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.sub .sbn{flex:1 1 auto;text-align:center;padding:8px 6px;font-size:11px;}
.sub::-webkit-scrollbar{display:none;}
.sbn{flex:0 0 auto;padding:9px 14px;border-radius:20px;border:1px solid var(--border);background:var(--sbtn-bg);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .08s;}
.sbn:active{transform:scale(.94);}
.sbn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.mrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.mb{flex:1 0 21%;padding:10px 0;border-radius:9px;border:1px solid var(--border);background:var(--sbtn-bg);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;transition:transform .08s;}
.mb:active{transform:scale(.94);}
.mb.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.yr{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px;}
.yr button{background:var(--sbtn-bg);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;color:var(--text);font-size:18px;cursor:pointer;transition:transform .08s;}
.yr button:active{transform:scale(.9);}
.yr span{font-size:17px;font-weight:800;color:var(--accent);min-width:64px;text-align:center;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="ov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;overflow-y:auto;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);">
  <div style="max-width:640px;margin:0 auto;background:var(--bg);border:1px solid var(--border2);border-radius:14px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);" id="ov-body"></div>
</div>
<div class="hdr">
  <div class="logo">AXION CYCLE<small>PESSOAL</small></div>
  <div style="display:flex;gap:8px;">
    <button class="icbtn" onclick="recarregar()" title="Atualizar">⟳</button>
    <button class="icbtn" onclick="toggleTheme()" title="Tema">◐</button>
  </div>
</div>
<div class="nav" id="nav">
  <button class="nb on" data-pg="dash" onclick="goTo('dash')"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>Dashboard</button>
  <button class="nb" data-pg="patr" onclick="goTo('patr')"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span>Patrimônio</button>
  <button class="nb" data-pg="orc" onclick="goTo('orc')"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Mensal</button>
  <button class="nb" data-pg="viag" onclick="goTo('viag')"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>Viagem</button>
</div>

<div id="pg-dash" class="page on"></div>
<div id="pg-patr" class="page"></div>
<div id="pg-orc" class="page"></div>
<div id="pg-viag" class="page"></div>

<script>
var SUPA_URL="https://qbnnxdqmxiwdgzciqhvx.supabase.co";
var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibm54ZHFteGl3ZGd6Y2lxaHZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxOTc3MDQsImV4cCI6MjA5Mzc3MzcwNH0.o175qai8T3sJA4ISbLL3uaeqj8nTByADCcqVjwpoFGk";
var HDRS={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var ITEMS=[];
var MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var BANCOS=['DollarApp','Inter','Revolut','Wise','Nomad'];
var PRODUTOS_RF=['Cofrinho','CDB','LCI','LCA','Poupança'];
var patrSub='cofr';
var _n=new Date();
var selYear=_n.getFullYear();
var selMonth=_n.getMonth()+1; // 1..12

// ── Utils ──────────────────────────────────────────────
function fmt(v){v=+v||0;return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtUSD(v){v=+v||0;return 'US$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseBRL(s){if(typeof s==='number')return s;s=(s||'').toString().trim();if(!s)return 0;s=s.replace(/[R$US\s.]/g,'').replace(',','.');return parseFloat(s)||0;}
function parseNum(s){return parseFloat((s||'0').toString().replace(/\./g,'').replace(',','.'))||0;}
// Quantidade de cotas: aceita fracionado com ponto (0.769) ou vírgula (0,769)
function parseQtd(s){s=(s||'').toString().trim();if(!s)return 0;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0;}
function maskBRL(el){var v=el.value.replace(/\D/g,'');if(!v){el.value='';return;}el.value=(parseInt(v,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function curMk(){return today().slice(0,7);}
function selMk(){return selYear+'-'+String(selMonth).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m,err){var t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(function(){t.className='toast';},2200);}
function fmtData(d){if(!d)return '';var p=(d||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;}
function toggleTheme(){document.body.classList.toggle('light');try{localStorage.setItem('pf_theme',document.body.classList.contains('light')?'light':'dark');}catch(e){}}

// ── Supabase (pf_items) ────────────────────────────────
function loadItems(cb){
  fetch(SUPA_URL+'/rest/v1/pf_items?select=*&order=id',{headers:HDRS})
    .then(function(r){return r.json();})
    .then(function(rows){ITEMS=Array.isArray(rows)?rows:[];cb&&cb();})
    .catch(function(){toast('Sem conexão com o banco',true);ITEMS=[];cb&&cb();});
}
function addItem(obj,cb){
  fetch(SUPA_URL+'/rest/v1/pf_items',{method:'POST',headers:Object.assign({},HDRS,{'Prefer':'return=representation'}),body:JSON.stringify(obj)})
    .then(function(r){return r.json();})
    .then(function(rows){if(Array.isArray(rows)&&rows[0])ITEMS.push(rows[0]);cb&&cb();})
    .catch(function(){toast('Erro ao salvar',true);cb&&cb();});
}
function updItem(id,obj,cb){
  fetch(SUPA_URL+'/rest/v1/pf_items?id=eq.'+id,{method:'PATCH',headers:HDRS,body:JSON.stringify(obj)})
    .then(function(r){if(!r.ok)toast('Falha ao salvar: '+r.status,true);var it=ITEMS.find(function(x){return x.id===id;});if(it)Object.assign(it,obj);cb&&cb();})
    .catch(function(){toast('Erro ao salvar',true);cb&&cb();});
}
function delItem(id,cb){
  fetch(SUPA_URL+'/rest/v1/pf_items?id=eq.'+id,{method:'DELETE',headers:HDRS})
    .then(function(){ITEMS=ITEMS.filter(function(x){return x.id!==id;});cb&&cb();})
    .catch(function(){toast('Erro ao remover',true);cb&&cb();});
}
function byTipo(t){return ITEMS.filter(function(x){return x.tipo===t;});}
// Recarrega dados do banco + cotações
function recarregar(){
  toast('Atualizando...');
  loadItems(function(){render();fetchPrices(function(){render();});fetchDolar();fetchCdi();});
}

// ── Cotação do dólar (config) ──────────────────────────
function getDolar(){var c=ITEMS.find(function(x){return x.tipo==='config'&&x.nome==='dolar_rate';});return c&&+c.valor?+c.valor:5.40;}
// ── Cotações de ações ao vivo (Yahoo via proxy) ────────
var QUOTE_URL='https://financeiro-ten-kappa.vercel.app/api/quote';
var CHART_URL='https://financeiro-ten-kappa.vercel.app/api/chart';
var _prices={};
// ── Gráfico 1 ano do ativo ───────────────────────────────────────────────
function _chartRangeLabel(r){return r==='5y'?'5 anos':'1 ano';}
function _chartRangeBtns(id,cur){
  function bt(r,lb){var on=(cur===r);return '<button onclick="openAcaoChart('+id+',\''+r+'\')" style="border:1px solid '+(on?'var(--accent)':'var(--border)')+';background:'+(on?'rgba(139,147,255,.18)':'transparent')+';color:'+(on?'var(--accent)':'var(--text2)')+';font-size:11px;font-weight:700;padding:4px 11px;border-radius:8px;cursor:pointer;">'+lb+'</button>';}
  return '<div style="display:flex;gap:6px;">'+bt('1y','1A')+bt('5y','5A')+'</div>';
}
function openAcaoChart(id,range){
  range=(range==='5y')?'5y':'1y';
  var a=ITEMS.find(function(x){return x.id===id;});if(!a)return;
  var sym=yahooSym(a);var tk=tickerOf(a);
  var head='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;"><div class="ttl" style="margin:0;">📈 '+esc(tk||a.nome)+'</div><div style="display:flex;align-items:center;gap:8px;">'+_chartRangeBtns(id,range)+'<button class="del" onclick="closeOv()">×</button></div></div>';
  var ov=document.getElementById('ov');var b=document.getElementById('ov-body');
  b.innerHTML=head+'<div style="text-align:center;padding:30px 10px;color:var(--text3);font-size:13px;">Carregando gráfico de '+_chartRangeLabel(range)+'…</div>';
  ov.style.display='block';
  fetch(CHART_URL+'?symbol='+encodeURIComponent(sym)+'&range='+range)
    .then(function(r){return r.json();})
    .then(function(j){renderAcaoChart(a,j,range);})
    .catch(function(){var b2=document.getElementById('ov-body');if(b2)b2.innerHTML=head+'<div style="text-align:center;padding:24px;color:#ef4444;font-size:13px;">Não consegui carregar o gráfico agora. Tente novamente.</div>';});
}
function renderAcaoChart(a,j,range){
  range=(range==='5y')?'5y':'1y';
  var b=document.getElementById('ov-body');if(!b)return;
  var tk=tickerOf(a);var moeda=(a.tipo==='acao_br')?'R$':'US$';
  var pts=(j&&j.points)||[];
  var head='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;"><div class="ttl" style="margin:0;">📈 '+esc(tk||a.nome)+'</div><div style="display:flex;align-items:center;gap:8px;">'+_chartRangeBtns(a.id,range)+'<button class="del" onclick="closeOv()">×</button></div></div>';
  if(!pts.length){b.innerHTML=head+'<div style="text-align:center;padding:24px;color:#ef4444;font-size:13px;">Sem dados de mercado para este ticker.</div>';return;}
  var nome=(j&&j.name)||nomeAtivo(a)||'';
  var W=600,H=230,padL=8,padR=8,padT=14,padB=22;
  var closes=pts.map(function(p){return p.c;});
  var min=Math.min.apply(null,closes),max=Math.max.apply(null,closes);
  var rng=(max-min)||1;var first=closes[0],last=closes[closes.length-1];
  var chg=last-first,chgP=first?chg/first*100:0;var up=chg>=0;var lc=up?'#22c55e':'#ef4444';
  function X(i){return padL+(i/(pts.length-1||1))*(W-padL-padR);}
  function Y(v){return padT+(1-(v-min)/rng)*(H-padT-padB);}
  var d='',area='';
  pts.forEach(function(p,i){var x=X(i).toFixed(1),y=Y(p.c).toFixed(1);d+=(i?'L':'M')+x+' '+y+' ';});
  area='M'+X(0).toFixed(1)+' '+Y(min).toFixed(1)+' '+d.replace(/^M/,'L')+'L'+X(pts.length-1).toFixed(1)+' '+Y(min).toFixed(1)+' Z';

var PIE_COLORS=['#a855f7','#22c55e','#60a5fa','#f59e0b','#ef4444','#16a34a','#a3e635','#ec4899','#14b8a6','#f97316','#8b5cf6','#06b6d4','#eab308','#f43f5e','#84cc16','#0ea5e9'];
function svgPie(slices,size){
  var tot=slices.reduce(function(s,x){return s+x.value;},0);if(tot<=0)return '';
  var r=size/2,cx=r,cy=r,ang=-Math.PI/2,p='';

    var frac=sl.value/tot,a2=ang+frac*2*Math.PI;
    if(frac>=0.9999){p+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+sl.color+'"/>';return;}
    var x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    p+='<path d="M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+(frac>0.5?1:0)+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z" fill="'+sl.color+'"/>';
    ang=a2;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex-shrink:0;">'+p+'</svg>';
}

function diasDesde(d){if(!d)return 0;var a=new Date((d.slice(0,10))+'T00:00:00'),b=new Date(today()+'T00:00:00');var ms=b-a;return ms>0?Math.floor(ms/86400000):0;}
// Feriados B3/bancários (nacionais + móveis via Páscoa) para contar dias úteis (base 252)
function _easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
var _holCache={};
function _holidays(y){
  var e=_easter(y),H={};
  function add(dt){H[dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')]=1;}
  function off(n){var x=new Date(e);x.setDate(x.getDate()+n);return x;}
  [[0,1],[3,21],[4,1],[8,7],[9,12],[10,2],[10,15],[10,20],[11,25]].forEach(function(md){add(new Date(y,md[0],md[1]));});
  add(off(-48));add(off(-47));add(off(-2));add(off(60)); // carnaval seg/ter, sexta santa, corpus christi
  return H;
}
function _isHol(dt){var y=dt.getFullYear();if(!_holCache[y])_holCache[y]=_holidays(y);return !!_holCache[y][y+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')];}
function diasUteis(dataStr){
  if(!dataStr)return 0;
  var a=new Date(dataStr.slice(0,10)+'T00:00:00'),b=new Date(today()+'T00:00:00');
  if(b<=a)return 0;
  var n=0,cur=new Date(a);cur.setDate(cur.getDate()+1);
  while(cur<=b){var wd=cur.getDay();if(wd!==0&&wd!==6&&!_isHol(cur))n++;cur.setDate(cur.getDate()+1);}
  return n;
}
// Rendimento do cofrinho: X% do CDI (qtd = % do CDI, padrão 105) por DIAS ÚTEIS (base 252)
// Meses completos (aniversários) desde a aplicação — para a poupança
function mesesCompletos(dataStr){
  if(!dataStr)return 0;
  var a=new Date(dataStr.slice(0,10)+'T00:00:00'),b=new Date(today()+'T00:00:00');
  if(b<=a)return 0;
  var m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate())m--;
  return m<0?0:m;
}
// Regra da poupança: 0,5%/mês se Selic>8,5% a.a.; senão 70% da Selic (TR≈0)
function selicAnual(){return getCdi()+0.10;} // Selic ≈ CDI + 0,1
function poupancaRateMes(){var s=selicAnual();if(s>8.5)return 0.005;var sm=Math.pow(1+s/100,1/12)-1;return 0.70*sm;}
function poupancaRend(c){var pv=+c.valor||0;if(pv<=0)return 0;var m=mesesCompletos(c.data);if(!m)return 0;return pv*Math.pow(1+poupancaRateMes(),m)-pv;}
function cofrinhoRend(c){
  if(rfProduto(c)==='Poupança')return poupancaRend(c);
  var pv=+c.valor||0;if(pv<=0)return 0;
  var du=diasUteis(c.data);if(!du)return 0;
  var pctCdi=(+c.qtd||105)/100;
  var iAnual=getCdi()/100*pctCdi;
  return pv*Math.pow(1+iAnual,du/252)-pv;
}
// IOF regressivo — só nos primeiros 30 dias corridos (% sobre o rendimento)
var IOF_TAB=[0,96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3,0];
function iofPct(dc){if(dc>=30)return 0;return (IOF_TAB[dc]||0)/100;}
// Produto da renda fixa fica em categoria. Isentos: LCI/LCA/Poupança. IOF só no CDB.
function rfProduto(c){return c.categoria||'Cofrinho';}
function rfIsento(c){var p=rfProduto(c);return p==='LCI'||p==='LCA'||p==='Poupança';}
function rfTemIOF(c){return rfProduto(c)==='CDB';}
function cofrinhoIOF(c){return rfTemIOF(c)?cofrinhoRend(c)*iofPct(diasDesde(c.data)):0;}
// IR regressivo (sobre o rendimento após IOF, por dias corridos)
function irAliquota(dc){if(dc<=180)return .225;if(dc<=360)return .20;if(dc<=720)return .175;return .15;}
function cofrinhoIR(c){return rfIsento(c)?0:(cofrinhoRend(c)-cofrinhoIOF(c))*irAliquota(diasDesde(c.data));}
function cofrinhoRendLiq(c){return cofrinhoRend(c)-cofrinhoIOF(c)-cofrinhoIR(c);}
function cofrinhoAtual(c){return (+c.valor||0)+cofrinhoRendLiq(c);}

function fmtN(v){return (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function kpi(lb,vl,col){return '<div class="kpi"><div style="display:flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;border-radius:50%;background:'+col+';flex-shrink:0;box-shadow:0 0 8px '+col+';"></span><div class="lb">'+lb+'</div></div><div class="vl" style="color:'+col+';margin-top:5px;">'+fmt(vl)+'</div></div>';}
function sparkHero(){
  var d='M0,25 L14,21 L28,23 L42,15 L56,18 L70,9 L84,12 L100,3';
  return '<svg width="112" height="40" viewBox="0 0 100 30" preserveAspectRatio="none" style="flex-shrink:0;">'+
    '<defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b93ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>'+
    '<linearGradient id="sgf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b93ff" stop-opacity=".35"/><stop offset="1" stop-color="#8b93ff" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+d+' L100,30 L0,30 Z" fill="url(#sgf)"/>'+
    '<path d="'+d+'" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function distribuicao(){
  var pt=patrimonioTotal();if(pt<=0)return '';
  var parts=[['Renda Fixa',totCofrinhos(),'#60a5fa'],['Terrenos',totTerrenos(),'#f59e0b'],['Ações BR',totAcoesBR(),'#22c55e'],['Ações EUA',totAcoesEUAbrl(),'#16a34a'],['Cripto',totCriptoBrl(),'#eab308'],['Dólar',totDolarBrl(),'#a3e635'],['Devedores',totDevedores(),'#f97316']];
  var slices=parts.filter(function(p){return p[1]>0;}).map(function(p){return {label:p[0],value:p[1],color:p[2]};}).sort(function(a,b){return b.value-a.value;});
  if(!slices.length)return '';
  var leg=slices.map(function(x){return '<div style="display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:6px;"><span style="width:11px;height:11px;border-radius:3px;background:'+x.color+';flex-shrink:0;"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+x.label+'</span><span style="color:var(--text3);font-weight:600;">'+(x.value/pt*100).toFixed(1)+'%</span><span class="num" style="min-width:82px;text-align:right;font-weight:700;">'+fmt(x.value)+'</span></div>';}).join('');
  var bars=slices.map(function(x){var pct=x.value/pt*100;return '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;"><span>'+x.label+'</span><span style="font-weight:700;">'+pct.toFixed(1)+'% · '+fmt(x.value)+'</span></div><div class="bar"><div style="width:'+pct.toFixed(1)+'%;background:'+x.color+';"></div></div></div>';}).join('');
  return '<div class="card"><div class="ttl">Distribuição do Patrimônio</div>'+
    '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;">'+svgPie(slices,140)+'<div style="flex:1;min-width:180px;">'+leg+'</div></div>'+
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">'+bars+'</div>'+
  '</div>';
}

    h+='<div style="font-size:20px;font-weight:800;color:'+col+';">'+fmt(totCur)+'</div>';
  }
  h+='<div style="font-size:11px;margin-bottom:8px;"><span style="color:'+gcol+';font-weight:700;">'+(totG>=0?'▲ +':'▼ ')+fmtCur(totG,moeda)+' ('+totPct.toFixed(2)+'%)</span> <span style="color:var(--text3);">· pago '+fmtCur(totCusto,moeda)+(isUSD?' · US$ '+fmtN(getDolar()):'')+'</span> <span style="color:var(--accent);cursor:pointer;font-weight:700;" onclick="atualizarCotacoes()">🔄 atualizar</span></div>';
  if(items.length>=2) h+=pieSection(items,moeda);

  items.slice().sort(function(x,y){return curVal(y)-curVal(x);}).forEach(function(a){

    h+='<div class="li" style="border-left-color:'+col+';flex-direction:column;align-items:stretch;gap:7px;">'+

           '<div class="nm">'+esc(a.nome||'—')+(nomeAtivo(a)?' <span style="font-size:10px;color:var(--text3);font-weight:400;">· '+esc(nomeAtivo(a))+'</span>':'')+'</div>'+
           '<div class="sb">'+(+a.qtd||0)+' cotas · pago '+fmtCur(a.valor,moeda)+' · <span style="color:'+igc+';font-weight:700;">'+(info.g>=0?'+':'')+info.pct.toFixed(2)+'%</span>'+(info.live?'':' <span style="color:#f59e0b;">(sem cotação)</span>')+(a.data?' · 📅 '+fmtData(a.data):'')+'</div>'+
         '</div>'+
         '<div style="text-align:right;flex-shrink:0;"><div class="vl" style="color:'+col+';">'+fmtCur(info.cv,moeda)+'</div>'+(isUSD?'<div style="font-size:10px;color:var(--accent);">'+fmt(info.cv*getDolar())+'</div>':'')+'</div>'+
       '</div>'+
       '<div style="display:flex;justify-content:flex-end;align-items:center;gap:2px;border-top:1px solid var(--border);padding-top:5px;">'+
         '<button class="del" style="color:#60a5fa;font-size:15px;" onclick="openAcaoChart('+a.id+')" title="Gráfico 1 ano">📈</button>'+
         '<button class="del" style="color:#22c55e;font-size:17px;" onclick="novaCompra('+a.id+')" title="Nova compra">＋</button>'+itemActions(a)+
       '</div>'+
     '</div>';});
  h+='<div class="add-box"><label class="fl">Ticker (ex: '+(isUSD?'AAPL, VOO':'PETR4, ITUB4')+')</label><input class="fi" id="ac-nome" placeholder="'+(isUSD?'AAPL':'PETR4')+'">'+

     '<div><label class="fl">Valor pago ('+moeda+')</label><input class="fi" id="ac-val" inputmode="decimal" placeholder="0,00" oninput="maskBRL(this)"></div></div>'+
     '<label class="fl" style="margin-top:8px;">Data da compra</label><input class="fi" id="ac-data" type="date" value="'+today()+'">'+

  return h+'</div>';

function addAcao(tipo){

  var existente=byTipo(tipo).find(function(a){return tickerOf(a)===nome;});
  if(existente){
    updItem(existente.id,{qtd:(+existente.qtd||0)+qtd,valor:(+existente.valor||0)+val},function(){fetchPrices(function(){render();});toast(nome+' atualizado (posição somada)!');});

  addItem({tipo:tipo,nome:nome,qtd:qtd,valor:val,data:(document.getElementById('ac-data')||{value:''}).value||today()},function(){fetchPrices(function(){render();});toast('Ação adicionada!');});
}

function devAjustar(id,sign){devAjusteId=id;devAjusteSign=sign;editingId=null;render();}
function cancelDevAjuste(){devAjusteId=null;render();}
function devAjusteBox(d){
  var add=devAjusteSign>0,cor=add?'#22c55e':'#ef4444';

    '<div style="font-size:12px;font-weight:700;margin-bottom:4px;">'+(add?'+ Adicionar':'− Retirar')+' valor — '+esc(d.nome||'')+'</div>'+

function saveDevAjuste(id){

// ── Reserva em Dólar (bancos com lista de movimentos: entrada US$+R$, retirada) ──
var dlEntradaId=null,dlRetiradaId=null,dlMovEditId=null,_dolarSeeding=false,_dlMigrating=false,dlListOpen={};
function dlToggleList(id){dlListOpen[id]=!dlListOpen[id];render();}
function dolarBancos(){return byTipo('dolar_banco');}
function dolarMovs(bankId){return byTipo('dolar_mov').filter(function(m){return String(m.meta)===String(bankId);}).sort(function(a,b){return (a.data||'').localeCompare(b.data||'');});}
function dlBankStats(bankId){
  var entUsd=0,entBrl=0,retUsd=0;
  dolarMovs(bankId).forEach(function(m){var u=+m.valor||0;if(m.categoria==='retirada')retUsd+=u;else{entUsd+=u;entBrl+=(+m.qtd||0);}});
  var media=entUsd>0?entBrl/entUsd:0,saldoUsd=entUsd-retUsd;
  return {entUsd:entUsd,entBrl:entBrl,retUsd:retUsd,media:media,saldoUsd:saldoUsd,saldoBrl:media*saldoUsd};
}
function seedDolarBancos(){
  if(_dolarSeeding)return;_dolarSeeding=true;
  addItemsBatch([{tipo:'dolar_banco',nome:'DollarApp'},{tipo:'dolar_banco',nome:'Inter'},{tipo:'dolar_banco',nome:'Wise'},{tipo:'dolar_banco',nome:'Nomad'}],function(){
    var da=ITEMS.find(function(x){return x.tipo==='dolar_banco'&&x.nome==='DollarApp';});
    if(da)addItem({tipo:'dolar_mov',categoria:'entrada',valor:513.49,qtd:Math.round(513.49*5.12*100)/100,meta:da.id,data:today()},function(){_dolarSeeding=false;render();});
    else{_dolarSeeding=false;render();}
  });
}
function dlNovaEntrada(id){dlEntradaId=id;dlRetiradaId=null;dlMovEditId=null;editingId=null;render();}
function dlNovaRetirada(id){dlRetiradaId=id;dlEntradaId=null;dlMovEditId=null;editingId=null;render();}
function dlCancelMov(){dlEntradaId=null;dlRetiradaId=null;dlMovEditId=null;render();}
function dlEditMov(id){var m=ITEMS.find(function(x){return x.id===id;});if(m)dlListOpen[m.meta]=true;dlMovEditId=id;dlEntradaId=null;dlRetiradaId=null;render();}
function viewDolar(){
  var bancos=dolarBancos();
  if(!bancos.length){seedDolarBancos();return '<div class="card"><div class="ttl">💵 Reserva em Dólar</div><div class="empty">Criando bancos padrão…</div></div>';}
  // Migra saldo antigo (bank.valor) para um movimento de entrada
  var legacy=bancos.filter(function(b){return (+b.valor>0.001)&&!dolarMovs(b.id).length;});
  if(legacy.length&&!_dlMigrating){
    _dlMigrating=true;
    addItemsBatch(legacy.map(function(b){return {tipo:'dolar_mov',categoria:'entrada',valor:+b.valor,qtd:+b.meta||0,meta:b.id,data:today()};}),function(){
      var i=0;(function next(){if(i>=legacy.length){_dlMigrating=false;render();return;}updItem(legacy[i++].id,{valor:0,meta:0},next);})();
    });
    return '<div class="card"><div class="ttl">💵 Reserva em Dólar</div><div class="empty">Atualizando…</div></div>';

// Nº de dias do período de uma cidade (início→fim, inclusivo). Se o 1º dia coincidir com o
// último dia da cidade anterior (dia de transição), ele não é contado de novo.
function cidDias(c,prev){
  var s=(c.data||'').slice(0,10),e=(c.obs||'').slice(0,10);
  if(!s)return 1;
  var base=(!e||e===s)?1:(Math.round((new Date(e+'T00:00:00')-new Date(s+'T00:00:00'))/86400000)+1);
  if(base<1)base=1;
  if(prev){var pe=(prev.obs||'').slice(0,10)||(prev.data||'').slice(0,10);if(pe&&pe===s)base-=1;}
  return base<0?0:base;
}

function addViagemDest(){
  var nome=prompt('Destino da viagem (ex: Cancún, Nova York):');if(nome==null)return;nome=(nome||'').trim();if(!nome){toast('Informe o destino',true);return;}

}
function renViagemDest(id){
  var d=ITEMS.find(function(x){return x.id===id;});if(!d)return;
  var nome=prompt('Nome da viagem:',d.nome||'');if(nome==null)return;nome=(nome||'').trim();if(!nome){toast('Informe o nome',true);return;}
  updItem(id,{nome:nome},function(){render();toast('Nome atualizado!');});
}
function rmViagemDest(id){
  if(!confirm('Apagar esta viagem, suas cidades e todos os gastos?'))return;
  var cids=viagemCidades(id);var cidIds={};cids.forEach(function(c){cidIds[String(c.id)]=1;});
  var gs=byTipo('viagem_gasto').filter(function(g){return String(g.meta)===String(id)||cidIds[String(g.meta)];});
  var toDel=gs.concat(cids);
  function delAll(k){if(k>=toDel.length){delItem(id,function(){viagemSel=null;render();toast('Viagem removida');});return;}delItem(toDel[k].id,function(){delAll(k+1);});}
  delAll(0);
}

function spDel(i){spSync();_sp.people.splice(i,1);if(!_sp.people.length)_sp.people.push({nome:'',valor:0,pg:false});renderSplit();}

function vgSplitIgual(){
  var c=document.getElementById('vg-split-list');if(!c)return;var rows=c.querySelectorAll('.vg-sp-row');
  if(!rows.length){toast('Toque em + Pessoa primeiro',true);return;}
  var total=parseBRL((document.getElementById('vg-brl')||{value:''}).value);var n=rows.length;
  var each=Math.floor((total/n)*100)/100,resto=Math.round((total-each*n)*100)/100;

function vgTogglePessoaPg(id,i){var g=ITEMS.find(function(x){return x.id===id;});if(!g)return;var info=vgInfo(g);if(!info.split||!info.split[i])return;info.split[i].pg=!info.split[i].pg;var allPaid=info.split.length>0&&info.split.every(function(p){return !!p.pg;});updItem(id,{obs:vgSetObs(info.fim,allPaid,info.local,info.split,info.items,info.res)},function(){render();});}

function _vgSumItems(items){var s=0,i;for(i=0;i<items.length;i++)s+=(+items[i].valor||0);return Math.round(s*100)/100;}
function vgAddPasseio(id){
  var g=ITEMS.find(function(x){return x.id===id;});if(!g)return;
  var nEl=document.getElementById('vp-nome-'+id),vEl=document.getElementById('vp-val-'+id);
  var nome=nEl?(nEl.value||'').trim():'';var val=parseBRL(vEl?vEl.value:'')||0;
  if(!val){toast('Informe o valor do passeio',true);return;}
  var info=vgInfo(g);var items=info.items.slice();
  // Migra o valor único já existente para o primeiro passeio, se ainda não houver itens
  if(!items.length&&(+g.valor||0)>0){items.push({nome:(g.nome&&g.nome!==g.categoria?g.nome:'Passeio 1'),valor:+g.valor||0});}
  items.push({nome:nome||('Passeio '+(items.length+1)),valor:val});
  var soma=_vgSumItems(items);
  updItem(id,{valor:soma,obs:vgSetObs(info.fim,info.pg,info.local,info.split,items,info.res)},function(){render();toast('Passeio adicionado!');});
}
function vgDelPasseio(id,idx){
  var g=ITEMS.find(function(x){return x.id===id;});if(!g)return;
  var info=vgInfo(g);var items=info.items.slice();if(!items[idx])return;
  items.splice(idx,1);
  var soma=_vgSumItems(items);
  updItem(id,{valor:soma,obs:vgSetObs(info.fim,info.pg,info.local,info.split,items,info.res)},function(){render();});
}

function addViagemGasto(destId){
  var tsel=document.getElementById('vg-tipo');var tipo=tsel?tsel.value:'';
  if(tipo==='__novo__')tipo=((document.getElementById('vg-tipo-novo')||{value:''}).value||'').trim();
  if(!tipo)tipo='Gasto';
  var desc=((document.getElementById('vg-desc')||{value:''}).value||'').trim();
  var brl=parseBRL(document.getElementById('vg-brl').value);
  var usd=parseQtd(document.getElementById('vg-usd').value);
  var ini=(document.getElementById('vg-ini')||{value:''}).value||today();
  var fim=(document.getElementById('vg-fim')||{value:''}).value||'';
  if(!brl&&!usd){toast('Informe o valor (R$ ou US$)',true);return;}
  var cidEl=document.getElementById('vg-cidade');var meta=(cidEl&&cidEl.value)?cidEl.value:destId;
  var lsel=document.getElementById('vg-local');var local=lsel?lsel.value:'';if(local==='Outro')local=((document.getElementById('vg-local-novo')||{value:''}).value||'').trim();
  var split=vgReadSplit();
  // Todas as cidades: lança o valor POR DIA em cada cidade (× nº de dias do período)
  if(meta==='__todas__'){
    var cids=viagemCidades(destId);
    if(!cids.length){toast('Nenhuma cidade no roteiro',true);return;}
    var perDia=(brl>0?('R$ '+fmtN(brl)):('US$ '+fmtN(usd)))+'/dia';
    var n=0;
    (function loop(k){
      if(k>=cids.length){render();toast(n+' gasto(s) lançados por dia!');if(typeof vgHideAdd==='function')vgHideAdd();return;}
      var c=cids[k];var dias=cidDias(c,k>0?cids[k-1]:null);var cIni=(c.data||'').slice(0,10)||ini;var cFim=(c.obs||'').slice(0,10);
      if(dias<=0){loop(k+1);return;}
      var vbrl=Math.round(brl*dias*100)/100;var vusd=Math.round(usd*dias*100)/100;
      var nm=(desc||tipo)+' — '+perDia+' × '+dias+'d';
      addItem({tipo:'viagem_gasto',nome:nm,categoria:tipo,valor:vbrl,qtd:vusd,data:cIni,meta:c.id,obs:vgSetObs((cFim&&cFim!==cIni?cFim:''),false,local,[],[],false)},function(){n++;loop(k+1);});
    })(0);
    return;
  }
  addItem({tipo:'viagem_gasto',nome:desc||tipo,categoria:tipo,valor:brl,qtd:usd,data:ini,meta:meta,obs:vgSetObs(fim,false,local,split)},function(){render();toast('Gasto adicionado!');});
}

    (isFat?'<div style="display:flex;gap:6px;margin-bottom:8px;"><button class="btn-add" style="padding:7px;font-size:11px;" onclick="document.getElementById(\'imp-pwd\').value=\'\';toast(\'Cartão 1\')">Cartão 1</button><button class="btn-add" style="padding:7px;font-size:11px;" onclick="document.getElementById(\'imp-pwd\').value=\'02533\';toast(\'Senha do Cartão 2 preenchida\')">Cartão 2 (senha)</button></div>':'')+
    '<input id="imp-pwd" class="fi" placeholder="Senha do PDF (se tiver)" style="margin-bottom:8px;">'+
    '<label class="fl">1) Enviar PDF</label>'+
    '<input type="file" accept="application/pdf" id="imp-file" onchange="lerPdfImport(this)" style="font-size:12px;width:100%;margin-bottom:4px;">'+
    '<div style="font-size:11px;color:var(--text3);margin:10px 0 6px;">— ou cole o texto —</div>'+
    '<textarea id="imp-txt" class="fi" style="height:130px;font-size:12px;resize:vertical;" placeholder="Cole aqui o texto do PDF..."></textarea>'+
    '<button class="btn-add" style="margin-top:10px;background:var(--accent);color:#fff;border:none;" onclick="analisarImport()">Analisar</button>';
  document.getElementById('ov').style.display='block';
}
function lerPdfImport(input){
  var f=input.files&&input.files[0];if(!f)return;
  var pwd=(document.getElementById('imp-pwd')||{value:''}).value||'';
  toast('Lendo PDF...');
  var rd=new FileReader();
  rd.onload=function(e){var buf=new Uint8Array(e.target.result);ensurePdfJs(function(){pdfToText(buf,pwd).then(function(txt){var ta=document.getElementById('imp-txt');if(ta)ta.value=txt;analisarImport();}).catch(function(err){var m=(err&&(err.name||err.message)||'')+'';if(/password/i.test(m))toast('PDF protegido — informe a senha e reenvie',true);else toast('Não consegui ler o PDF — cole o texto',true);});});input.value='';};
  rd.readAsArrayBuffer(f);
}
function analisarImport(){
  var txt=(document.getElementById('imp-txt')||{value:''}).value||'';
  var list=_imp.origem==='fatura'?parseFatura(txt).items:parseExtrato(txt);
  if(!list.length){toast('Nenhum gasto reconhecido',true);return;}
  var rules=getImportRules();
  _imp.rows=list.map(function(x){
    var r=rules[normDesc(x.desc)];
    return {raw:x.desc,nome:(r&&r.nome)||x.desc,valor:x.valor,dia:x.dia||'01',mk:x.mk||'',cat:(r&&r.cat)||x.cat||'',dest:(r&&r.dest)||(x.receita?'ganho':'gasto_extra'),known:!!r,receita:!!x.receita};
  });
  previewImport();
}
// Parser do extrato Inter: linhas com "-R$ x" (gasto) + saldo; ignora recebidos
function cleanExtratoDesc(d){
  d=(d||'').replace(/"/g,'').trim();
  d=d.replace(/^(pix enviado|pix recebido|pagamento efetuado|pagamento sefaz[^:]*|pagamento|sal[aá]rio recebido[^:]*|compra|d[eé]bito autom[aá]tico[^:]*|ted|doc)\s*:?\s*/i,'');
  d=d.replace(/^cp\s*:?\s*\d+\s*-\s*/i,'');
  d=d.replace(/^\d{4,}\s*-\s*/,'');
  return d.replace(/\s+/g,' ').trim();
}
var MES_NUM={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function mesNum(nm){nm=String(nm||'').toLowerCase();if(nm.normalize)nm=nm.normalize('NFD').replace(/[̀-ͯ]/g,'');return MES_NUM[nm]||0;}
function parseExtrato(txt){
  var lines=txt.split(/\n/).map(function(s){return s.trim();}).filter(Boolean);
  var out=[],curDia='01',curMk='';
  var reDay=/^(\d{1,2})\s+de\s+([a-zçãéêó]+)\s+de\s+(\d{4})/i;
  var reVal=/(-?)\s*R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})/g;
  var skip=/(saldo total|saldo dispon|saldo bloque|per[ií]odo|cpf\/cnpj|institui[cç]|fale com|ouvidoria|^sac\b|defici[eê]ncia|solicitado em|valor\s+saldo|saldo por transa|saldo do dia)/i;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    var dm=ln.match(reDay);if(dm){curDia=dm[1];var _mn=mesNum(dm[2]);if(_mn)curMk=dm[3]+'-'+String(_mn).padStart(2,'0');continue;}
    if(skip.test(ln)&&!/R\$/.test(ln))continue;
    reVal.lastIndex=0;var vals=[],m;
    while((m=reVal.exec(ln))){vals.push({sign:m[1]==='-'?-1:1,v:parseBRL(m[2]),idx:m.index});}
    if(!vals.length)continue;
    var first=vals[0];var valor=first.sign*first.v;
    if(!valor)continue; // ignora valor zero
    var receita=valor>0; // positivo = recebido/ganho
    var desc=cleanExtratoDesc(ln.slice(0,first.idx));
    if(!desc)desc=receita?'Recebimento':'Gasto';
    out.push({desc:desc,valor:Math.abs(valor),dia:String(Math.min(28,Math.max(1,parseInt(curDia,10)||1))).padStart(2,'0'),cat:receita?'':autoCat(desc),receita:receita,mk:curMk||''});
  }
  return out;
}
// Parser robusto: cobre fatura multi-linha (BB: data / descrição / país / R$ valor)
// e formato de linha única (data descrição R$ valor). Ignora resumo/limites/juros.
function parseFatura(txt){
  var lines=txt.split(/\n/).map(function(s){return s.trim();}).filter(function(s){return s;});
  var out=[],curDia='01',desc=[],haveDate=false,total=0;
  var reDate=/^(\d{1,2})[\/.](\d{1,2})(?:[\/.]\d{2,4})?$/;
  var reValOnly=/^-?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2}$/;
  var reValEnd=/(-?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
  var noise=/(cota[cç][aã]o do d[oó]lar|d[oó]lar americano|^\*\*\*|^[a-z]{2}$|p[aá]gina|www\.|\.com\.br|central de|ouvidoria|^sac\b|^br$|^gb$|\*{4,}|^data\b|descri[cç][aã]o)/i;
  var skip=/(limite|saldo fatura|pagamentos?\/?cr|resumo|op[cç][oõ]es de pagament|pagamento m[ií]nimo|encargos|juros de mora|multa contratual|CET|mensalidade|pontos smiles|tarifa|informa[cç][oõ]es|compras nacionais|compras internacionais|i[o0]f\b|valor total|subtotal|despesas at[eé]|vencimento)/i;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/total da fatura|valor total devido/i.test(ln)){var mv=ln.match(reValEnd);if(mv)total=parseBRL(mv[1]);else if(lines[i+1]&&reValOnly.test(lines[i+1]))total=parseBRL(lines[i+1]);continue;}
    if(!total&&/^total$/i.test(ln)&&lines[i+1]&&reValOnly.test(lines[i+1])){total=parseBRL(lines[i+1]);continue;}
    if(noise.test(ln))continue;
    if(reDate.test(ln)){var dm=ln.match(reDate);curDia=dm[1];desc=[];haveDate=true;continue;}
    if(reValOnly.test(ln)){
      var v=parseBRL(ln);
      if(haveDate&&v>0&&desc.length){out.push(mkItem(desc.join(' '),v,curDia));}
      desc=[];haveDate=false;continue;
    }
    // XP: linha com DOIS valores no fim (R$ e US$) — pega o R$ (primeiro)
    var m2=ln.match(/(-?\s*\d{1,3}(?:\.\d{3})*,\d{2})\s+(-?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2})\s*$/);
    var me=ln.match(reValEnd);
    if(m2||me){
      var idx=m2?m2.index:me.index, valTok=m2?m2[1]:me[1];
      var ld=ln.match(/^(\d{1,2})[\/.](\d{1,2})/);
      var body=ln.slice(0,idx).replace(/^\d{1,2}[\/.]\d{1,2}([\/.]\d{2,4})?\s*/,'').trim();
      var vv=parseBRL(valTok);
      if(vv>0&&(ld||haveDate)&&!skip.test(body)&&(body||desc.length)){out.push(mkItem((desc.join(' ')+' '+body).trim(),vv,ld?ld[1]:curDia));}
      desc=[];haveDate=ld?false:haveDate;continue;
    }
    if(skip.test(ln)){desc=[];continue;}
    desc.push(ln);
  }
  return {items:out,total:total};
}
function mkItem(d,v,dia){
  d=(d||'').replace(/\s+/g,' ').trim()||'Compra';
  return {desc:d,valor:v,dia:String(Math.min(28,Math.max(1,parseInt(dia,10)||1))).padStart(2,'0'),cat:autoCat(d)};
}
function autoCat(d){d=(d||'').toLowerCase();
  if(/(mercado|super|atacad|padaria|acougue|hortifruti|ifood|restaurante|lanch|food|pizzar)/.test(d))return 'Alimentação';
  if(/(uber|99|posto|combust|gasolina|estacion|pedagio|latam|gol|azul)/.test(d))return 'Transporte';
  if(/(farmac|drogaria|unimed|hospital|clinic|laborat)/.test(d))return 'Saúde';
  if(/(netflix|spotify|amazon prime|assinatura|prime|hbo|disney|youtube|apple.com)/.test(d))return 'Assinaturas';
  if(/(shopping|loja|magaz|renner|zara|roupa|americanas|shopee|mercadolivre|aliexpress)/.test(d))return 'Compras';
  return '';
}
function impSomaTxt(){var g=0,r=0;_imp.rows.forEach(function(x){if(x.dest==='descartar')return;if(x.dest==='ganho')r+=x.valor;else g+=x.valor;});return _imp.rows.length+' itens · <span style="color:#ef4444;">gastos '+fmt(g)+'</span> · <span style="color:#22c55e;">ganhos '+fmt(r)+'</span>';}
function previewImport(){
  var b=document.getElementById('ov-body');
  var destOpts=function(sel){return [['ganho','Ganho'],['gasto_fixo','Fixo'],['gasto_extra','Extra'],['gasto_outro','Outros'],['descartar','Descartar']].map(function(o){return '<option value="'+o[0]+'"'+(sel===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');};
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div class="ttl" style="margin:0;font-size:14px;"><span id="imp-soma">'+impSomaTxt()+'</span></div><button class="del" onclick="closeOv()">×</button></div>'+
    '<div style="font-size:10px;color:var(--text3);margin-bottom:8px;">Gastos (vermelho) e recebidos (verde). Escolha o destino de cada linha — recebidos podem ir para Ganho ou Descartar. Descrições iguais no mesmo mês são somadas.</div>'+
    '<div style="max-height:52vh;overflow-y:auto;">';
  _imp.rows.forEach(function(x,i){
    h+='<div id="imp-row-'+i+'" style="border:1px solid var(--border);border-radius:9px;padding:8px;margin-bottom:6px;background:var(--bg2);'+(x.dest==='descartar'?'opacity:.45;':'')+'">'+
      '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">'+
        '<input class="fi" value="'+esc(x.nome)+'" onchange="impSetNome('+i+',this.value)" style="flex:1;min-width:0;font-size:12px;padding:6px 8px;">'+
        (x.known?'<span style="font-size:9px;font-weight:700;color:var(--accent);white-space:nowrap;" title="Preenchido pelo histórico">✓ aprendido</span>':'')+
        '<span style="font-size:13px;font-weight:800;color:'+(x.receita?'#22c55e':'#ef4444')+';white-space:nowrap;">'+(x.receita?'+ ':'')+fmt(x.valor)+'</span>'+
      '</div>'+
      '<div style="display:flex;gap:6px;align-items:center;">'+
        '<select class="fi" onchange="impSetDest('+i+',this.value)" style="flex:1;font-size:12px;padding:6px 8px;">'+destOpts(x.dest)+'</select>'+
        '<input class="fi" value="'+esc(x.cat||'')+'" onchange="impSetCat('+i+',this.value)" placeholder="Categoria" style="flex:1;min-width:0;font-size:12px;padding:6px 8px;">'+
        '<span style="font-size:10px;color:'+(x.mk?'var(--accent)':'var(--text3)')+';white-space:nowrap;font-weight:'+(x.mk?'700':'400')+';">'+(x.mk?(MONTHS[+x.mk.slice(5,7)-1]+'/'+x.mk.slice(2,4)):('dia '+x.dia))+'</span>'+
      '</div>'+
    '</div>';
  });
  h+='</div><button class="btn-add" style="margin-top:10px;background:var(--accent);color:#fff;border:none;" onclick="applyImport()">✓ Distribuir gastos</button>';
  b.innerHTML=h;
}
function impSetNome(i,v){if(_imp.rows[i])_imp.rows[i].nome=v;}
function impSetCat(i,v){if(_imp.rows[i])_imp.rows[i].cat=v;}
function impSetDest(i,v){
  var r=_imp.rows[i];if(!r)return;r.dest=v;
  var el=document.getElementById('imp-row-'+i);if(el)el.style.opacity=(v==='descartar')?'.45':'1';
  var s=document.getElementById('imp-soma');if(s)s.innerHTML=impSomaTxt();
}
function applyImport(){
  var selM=selMk();
  var picks=_imp.rows.filter(function(r){return r.dest&&r.dest!=='descartar';});
  if(!picks.length){toast('Escolha o destino de ao menos um gasto',true);return;}
  var agg={};
  picks.forEach(function(r){var nome=(r.nome||'').trim()||'Gasto';var mkk=r.mk||selM;var key=r.dest+'|'+mkk+'|'+nome.toLowerCase();if(!agg[key])agg[key]={tipo:r.dest,mk:mkk,nome:nome,valor:0,cat:(r.cat||'').trim()};agg[key].valor+=r.valor;});
  var updates=[],adds=[];
  Object.keys(agg).forEach(function(k){
    var a=agg[k];
    var ex=ITEMS.find(function(x){return x.tipo===a.tipo&&(x.data||'').slice(0,7)===a.mk&&(x.nome||'').trim().toLowerCase()===a.nome.toLowerCase();});
    if(ex)updates.push({id:ex.id,valor:(+ex.valor||0)+a.valor});
    else adds.push({tipo:a.tipo,nome:a.nome,valor:a.valor,data:a.mk+'-01',categoria:a.cat});
  });
  // Aprende: memoriza descrição do extrato/fatura → destino, categoria e nome escolhidos
  var rules=getImportRules();
  picks.forEach(function(r){var key=normDesc(r.raw||r.nome);if(key)rules[key]={nome:(r.nome||'').trim(),cat:(r.cat||'').trim(),dest:r.dest};});
  var n=updates.length+adds.length,ui=0;
  function finish(){saveImportRules(rules,function(){closeOv();render();toast(n+' gasto(s) distribuído(s)!');});}
  function doAdds(){if(!adds.length){finish();return;}addItemsBatch(adds,finish);}
  function nextUpd(){if(ui>=updates.length){doAdds();return;}var u=updates[ui++];updItem(u.id,{valor:u.valor},nextUpd);}
  nextUpd();
}
function cartaoItensMes(mk){return ITEMS.filter(function(x){return x.tipo==='cartao_item'&&(x.data||'').slice(0,7)===mk;});}

// ── Ler PDF da fatura (pdf.js sob demanda) ─────────────
function ensurePdfJs(cb){
  if(window.pdfjsLib){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=function(){try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}cb();};
  s.onerror=function(){toast('Falha ao carregar leitor de PDF',true);};
  document.head.appendChild(s);
}
function pdfToText(buf,pwd){
  return pdfjsLib.getDocument({data:buf,password:pwd||''}).promise.then(function(pdf){
    var texto='';
    function pagina(p){
      if(p>pdf.numPages)return Promise.resolve(texto);
      return pdf.getPage(p).then(function(pg){return pg.getTextContent();}).then(function(tc){
        var linhas={};
        tc.items.forEach(function(it){if(!it.str)return;var y=Math.round(it.transform[5]);(linhas[y]=linhas[y]||[]).push({x:it.transform[4],s:it.str});});
        Object.keys(linhas).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
          texto+=linhas[y].sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(' ')+'\n';
        });
        return pagina(p+1);
      });
    }
    return pagina(1);
  });
}
function lerPdfFatura(input){
  var f=input.files&&input.files[0];if(!f){return;}
  var pwd=(document.getElementById('fat-pwd')||{value:''}).value||'';
  toast('Lendo PDF...');
  var rd=new FileReader();
  rd.onload=function(e){
    var buf=new Uint8Array(e.target.result);
    ensurePdfJs(function(){
      pdfToText(buf,pwd).then(function(txt){
        var ta=document.getElementById('fat-txt');if(ta)ta.value=txt;
        analisarFatura();
      }).catch(function(err){
        var m=(err&&(err.name||err.message)||'')+'';
        if(/password/i.test(m)) toast('PDF protegido — digite a senha e envie de novo',true);
        else toast('Não consegui ler o PDF — cole o texto manualmente',true);
      });
    });
    input.value='';
  };
  rd.readAsArrayBuffer(f);
}
